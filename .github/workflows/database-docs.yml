name: Database docs

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/generate-database-docs.mjs'
      - 'docs/database/**'
      - 'package.json'
      - '.github/workflows/database-docs.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'scripts/generate-database-docs.mjs'
      - 'docs/database/**'
      - 'package.json'
      - '.github/workflows/database-docs.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run db:docs:check
