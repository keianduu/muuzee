name: Temporary AGENTS database docs updater

on:
  push:
    branches:
      - chore/agents-db-docs-rule

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/agents-db-docs-rule
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/tmp_update_agents_db_docs.py
      - name: Commit AGENTS.md
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: require database ER docs sync"
          git push origin HEAD:chore/agents-db-docs-rule
