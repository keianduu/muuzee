<body class="muuzee-app mypage-page personal-collection-page" data-personal-kind="favorites">
  <header class="site-header is-over-sheet">
    <div class="shell header-inner">
      <a class="logo" href="./index.html">Muuzee</a>
      <div class="header-actions">
<a aria-label="MyPage" class="avatar" href="./my-art.html">
          <img alt="ashelry" src="./assets/images/profile-avatar.jpg">
        </a>
      </div>
    </div>
  </header>
  <main>
    <section class="mypage-profile-shell">
      <div class="shell mypage-profile" data-mypage-profile></div>
    </section>

    <section class="mypage-nav-shell">
      <div class="shell" data-mypage-nav data-mypage-active="favorites"></div>
    </section>
    <div class="shell mypage-content-shell">
      <div class="collection-tabs is-pill-buttons" role="tablist" aria-label="カテゴリ">
        <button class="collection-tab is-active" type="button" role="tab" aria-selected="true" data-collection-tab="museum">
          <span>美術館</span><em>0</em>
        </button>
        <button class="collection-tab" type="button" role="tab" aria-selected="false" data-collection-tab="artist">
          <span>アーティスト</span><em>0</em>
        </button>
      </div>

      <div class="collection-list museum-grid" data-collection-list></div>

      <div class="collection-empty" data-collection-empty hidden>
        <h3 data-empty-title></h3>
        <p data-empty-copy></p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="shell footer-inner">
      <nav aria-label="Primary navigation" class="footer-nav">
        <a class="nav-item" href="./index.html"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9H7v-6h10v6"></path></svg><span>ホーム</span></a>

        <a class="nav-item" href="./artists.html"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"></rect><circle cx="12" cy="9" r="2.4"></circle><path d="M8.5 17c.5-2.3 1.8-3.5 3.5-3.5s3 1.2 3.5 3.5"></path></svg><span>アーティスト</span></a>
        <a class="nav-item" href="./museums.html"><svg viewBox="0 0 24 24"><path d="M3 9h18M5 9v10M9 9v10M15 9v10M19 9v10M3 19h18M4 8l8-5 8 5"></path></svg><span>美術館</span></a>
        <a class="nav-item" href="./map.html"><svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"></path><path d="M9 3v15M15 6v15"></path></svg><span>マップ</span></a>
        <a class="nav-item" href="./saved.html"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"></path></svg><span>保存</span></a>
      </nav>
    </div>
  </footer>
