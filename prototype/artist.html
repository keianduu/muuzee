<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>アーティスト詳細 — Muuzee</title>
  <meta name="description" content="Muuzee アーティスト詳細ページ Prototype">
  <link rel="stylesheet" href="./assets/css/muuzee-global.css?v=20260911-login-prototype-02">
  

<link rel="stylesheet" href="./assets/css/muuzee-detail.css?v=20260826-09">
<link rel="stylesheet" href="./assets/css/artist.css?v=20260826-09">
<link rel="stylesheet" href="./assets/css/muuzee-exhibition-card.css?v=20260826-14">
<link rel="stylesheet" href="./assets/css/muuzee-save-control.css?v=20260828-24">
  <script src="./assets/js/muuzee-profile-avatar-preload.js?v=20260908-01"></script>
</head>
<body class="muuzee-app artist-page">
  <header class="site-header" id="siteHeader">
    <div class="shell header-inner">
      <a class="logo" href="./index.html">Muuzee</a>
      <div class="header-actions">
<a aria-label="MyPage" class="avatar" href="./my-art.html" title="ashelry"><img alt="ashelry" loading="eager" src="./assets/images/profile-avatar.jpg"></a>
      </div>
    </div>
  </header>

  <main>
    <section class="artist-hero detail-media-hero" id="top">
      <img data-artist-hero alt="" loading="eager">
    </section>

    <section class="artist-detail-sheet" data-muuzee-sheet>
      <div class="shell">
        <header class="artist-sheet-head">
          <div class="artist-sheet-copy">
            <div class="artist-sheet-meta" data-artist-categories></div>
            <h1 class="artist-sheet-title" data-artist-name>Artist</h1>
            <p class="artist-sheet-sub" data-artist-sub></p>
          </div>
          <button class="artist-save-button" type="button" data-artist-save aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"></path></svg>
            <span>保存</span>
          </button>
        </header>

        <section class="artist-overview">
          <div>
            <div class="kicker">About the artist</div>
            <p class="artist-lead" data-artist-intro></p>
          </div>
          <dl class="artist-info-card">
            <div class="artist-info-row"><dt>作風</dt><dd data-artist-style></dd></div>
            <div class="artist-info-row"><dt>出身国</dt><dd data-artist-country></dd></div>
            <div class="artist-info-row"><dt>活動年代</dt><dd data-artist-era></dd></div>
          </dl>
        </section>

        <section class="artist-section">
          <div class="artist-section-head">
            <div class="artist-section-title"><small>Masterpieces</small><h2>有名作品</h2></div>
          </div>
          <div class="work-list" data-famous-works></div>
        </section>

        <section class="artist-section">
          <div class="artist-section-head">
            <div class="artist-section-title"><small>Exhibitions now</small><h2>現在の開催展覧会</h2></div>
          </div>
          <div class="poster-shell"><div class="poster-rail" data-current-exhibitions></div></div>
        </section>

        <section class="artist-section">
          <div class="artist-section-head">
            <div class="artist-section-title"><small>Where to see</small><h2>作品が置かれている美術館</h2></div>
          </div>
          <div class="museum-list" data-museums></div>
        </section>

        <section class="artist-section">
          <div class="artist-section-head">
            <div class="artist-section-title"><small>Related artists</small><h2>関連アーティスト</h2></div>
            <a class="more" href="./artists.html">すべて見る →</a>
          </div>
          <div class="related-artist-rail" data-related-artists></div>
        </section>
      </div>
    </section>
  </main>

    <footer class="footer">
    <div class="shell footer-inner">
      <nav aria-label="Primary navigation" class="footer-nav">
        <a class="nav-item" href="./index.html">
          <svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9H7v-6h10v6"></path></svg>
          <span>ホーム</span>
        </a>
        <a class="nav-item" href="./exhibitions.html">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"></rect><circle cx="9" cy="9" r="1.5"></circle><path d="m6.5 17 4-4 3 3 2-2 2 3"></path></svg>
          <span>展示会</span>
        </a>
        <a class="nav-item active" href="./artists.html">
          <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"></rect><circle cx="12" cy="9" r="2.4"></circle><path d="M8.5 17c.5-2.3 1.8-3.5 3.5-3.5s3 1.2 3.5 3.5"></path></svg>
          <span>アーティスト</span>
        </a>
        <a class="nav-item" href="./museums.html">
          <svg viewBox="0 0 24 24"><path d="M3 9h18M5 9v10M9 9v10M15 9v10M19 9v10M3 19h18M4 8l8-5 8 5"></path></svg>
          <span>美術館</span>
        </a>
        <a class="nav-item" href="./map.html">
          <svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"></path><path d="M9 3v15M15 6v15"></path></svg>
          <span>マップ</span>
        </a>
        <a class="nav-item" href="./saved.html">
          <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"></path></svg>
          <span>保存</span>
        </a>
      </nav>
    </div>
  </footer>

  <script src="./assets/js/muuzee-global.js?v=20260911-login-prototype-02"></script>
  <script src="./assets/js/artist-data.js?v=20260826-10"></script>
  <script src="./assets/js/artist.js?v=20260826-14"></script>
<script src="./assets/js/muuzee-exhibition-card.js?v=20260826-14"></script>
<script src="./assets/js/muuzee-save-control.js?v=20260911-login-prototype-01"></script>
  <script defer src="./assets/js/muuzee-profile-ui.js?v=20260908-avatar-flash-01"></script>
</body>
</html>
