<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>アーティストを探す — Muuzee</title>
  <link rel="stylesheet" href="./assets/css/muuzee-global.css?v=20260902-02">
  <link rel="stylesheet" href="./assets/css/list-filter.css?v=20260826-05">
  <link rel="stylesheet" href="./assets/css/artists.css?v=20260826-05">
<link rel="stylesheet" href="./assets/css/muuzee-save-control.css?v=20260828-24">
</head>
<body class="muuzee-app artists-page">
  <header class="site-header">
    <div class="shell header-inner">
      <a class="logo" href="./index.html">Muuzee</a>
      <div class="header-actions">
<a aria-label="MyPage" class="avatar" href="./my-art.html" title="ashelry"><img alt="ashelry" loading="eager" src="./assets/images/profile-avatar.jpg"/></a>
</div>
    </div>
  </header>

  <main>
    <section class="artists-intro">
      <div class="shell">
        <div class="artists-kicker">Artists</div>
        <div class="artists-heading-row">
          <h1>アーティストを探す</h1>
          <p><strong data-artist-count>18</strong> artists</p>
        </div>
      </div>
    </section>

    <section class="artists-results">
      <div class="shell">
        <div class="active-filters" data-active-filters hidden></div>
        <div class="artist-grid" data-artist-grid></div>
        <div class="artist-empty" data-artist-empty hidden>
          <p>条件に合うアーティストが見つかりませんでした。</p>
          <button type="button" data-empty-reset>条件をクリア</button>
        </div>
      </div>
    </section>
  </main>

  <button class="search-fab" type="button" data-filter-open aria-label="アーティストを絞り込む">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
    <span>絞り込み</span>
  </button>

  <div class="filter-backdrop" data-filter-backdrop hidden></div>
  <section class="filter-sheet" data-filter-sheet aria-hidden="true" aria-label="アーティストの絞り込み">
    <div class="filter-sheet-head">
      <div>
        <small>Filter artists</small>
        <h2>絞り込み</h2>
      </div>
      <button class="filter-close" type="button" data-filter-close aria-label="閉じる">
        <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"></path></svg>
      </button>
    </div>

    <div class="filter-sheet-body">
      <div class="filter-group">
        <h3>キーワード</h3>
        <label class="keyword-input-wrap">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg>
          <input type="search" placeholder="アーティスト名で検索" data-keyword>
        </label>
      </div>

      <div class="filter-group">
        <h3>ジャンル / 美術運動</h3>
        <div class="filter-chips" data-filter-group="category">
          <button type="button" class="filter-chip" data-value="現代美術">現代美術</button>
          <button type="button" class="filter-chip" data-value="印象派">印象派</button>
          <button type="button" class="filter-chip" data-value="ポスト印象派">ポスト印象派</button>
          <button type="button" class="filter-chip" data-value="ポップアート">ポップアート</button>
          <button type="button" class="filter-chip" data-value="近代美術">近代美術</button>
          <button type="button" class="filter-chip" data-value="日本美術">日本美術</button>
        </div>
      </div>

      <div class="filter-group">
        <h3>出身</h3>
        <div class="filter-chips" data-filter-group="origin" data-single-select>
          <button type="button" class="filter-chip" data-value="日本人">日本人</button>
          <button type="button" class="filter-chip" data-value="外国人">外国人</button>
        </div>
      </div>

      <div class="filter-group" data-country-section>
        <h3>国 <span>外国人</span></h3>
        <div class="filter-chips" data-filter-group="country">
          <button type="button" class="filter-chip" data-value="フランス">フランス</button>
          <button type="button" class="filter-chip" data-value="アメリカ">アメリカ</button>
          <button type="button" class="filter-chip" data-value="イギリス">イギリス</button>
          <button type="button" class="filter-chip" data-value="ドイツ">ドイツ</button>
          <button type="button" class="filter-chip" data-value="スペイン">スペイン</button>
          <button type="button" class="filter-chip" data-value="オランダ">オランダ</button>
          <button type="button" class="filter-chip" data-value="メキシコ">メキシコ</button>
        </div>
      </div>

      <div class="filter-group">
        <h3>活動年代</h3>
        <div class="filter-chips" data-filter-group="era">
          <button type="button" class="filter-chip" data-value="19世紀以前">19世紀以前</button>
          <button type="button" class="filter-chip" data-value="19世紀">19世紀</button>
          <button type="button" class="filter-chip" data-value="20世紀前半">20世紀前半</button>
          <button type="button" class="filter-chip" data-value="20世紀後半">20世紀後半</button>
          <button type="button" class="filter-chip" data-value="2000年代以降">2000年代以降</button>
        </div>
      </div>
    </div>

    <div class="filter-sheet-actions">
      <button class="filter-reset" type="button" data-filter-reset>クリア</button>
      <button class="filter-apply" type="button" data-filter-apply>この条件で見る</button>
    </div>
  </section>

    <footer class="footer">
    <div class="shell footer-inner">
      <nav aria-label="Primary navigation" class="footer-nav">
        <a class="nav-item" href="./index.html">
          <svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9H7v-6h10v6"></path></svg>
          <span>ホーム</span>
        </a>
        <a class="nav-item" href="./exhibitions.html">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"></rect><circle cx="9" cy="9" r="1.5"></circle><path d="m6.5 17 4-4 3 3 2-2 2 3"></path></svg>
          <span>展示会</span>
        </a>
        <a class="nav-item active" href="./artists.html">
          <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"></rect><circle cx="12" cy="9" r="2.4"></circle><path d="M8.5 17c.5-2.3 1.8-3.5 3.5-3.5s3 1.2 3.5 3.5"></path></svg>
          <span>アーティスト</span>
        </a>
        <a class="nav-item" href="./museums.html">
          <svg viewBox="0 0 24 24"><path d="M3 9h18M5 9v10M9 9v10M15 9v10M19 9v10M3 19h18M4 8l8-5 8 5"></path></svg>
          <span>美術館</span>
        </a>
        <a class="nav-item" href="./map.html">
          <svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"></path><path d="M9 3v15M15 6v15"></path></svg>
          <span>マップ</span>
        </a>
        <a class="nav-item" href="./saved.html">
          <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"></path></svg>
          <span>保存</span>
        </a>
      </nav>
    </div>
  </footer>

  <script src="./assets/js/muuzee-global.js?v=20260901-03"></script>
  <script src="./assets/js/list-filter.js?v=20260826-05"></script>
  <script src="./assets/js/artist-data.js?v=20260826-10"></script><script src="./assets/js/artists.js?v=20260826-05"></script>
<script src="./assets/js/muuzee-save-control.js?v=20260828-23"></script>
  <script defer src="./assets/js/muuzee-profile-ui.js?v=20260908-01"></script>
</body>
</html>
