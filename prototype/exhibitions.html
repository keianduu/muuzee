<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>展覧会を探す — Muuzee</title>
  <link rel="stylesheet" href="./assets/css/muuzee-global.css?v=20260902-02">
  <link rel="stylesheet" href="./assets/css/exhibitions.css?v=20260826-03">
<link rel="stylesheet" href="./assets/css/muuzee-save-control.css?v=20260828-24">
</head>
<body class="muuzee-app exhibitions-page">
<header class="site-header">
<div class="shell header-inner">
<a class="logo" href="./">Muuzee</a>
<div class="header-actions">
<a aria-label="MyPage" class="avatar" href="./my-art.html" title="ashelry"><img alt="ashelry" loading="eager" src="./assets/images/profile-avatar.jpg"/></a>
</div>
</div>
</header>
<main class="exhibitions-main">
  <section class="exhibitions-intro">
    <div class="shell">
      <div class="exhibitions-intro-copy">
        <small>Discover exhibitions</small>
        <h1>展覧会を探す</h1>
        <p>いま見られる展覧会、これから始まる展覧会から、気になるものを見つける。</p>
      </div>
      <div class="result-summary" aria-live="polite">
        <span data-result-count>0</span> exhibitions
      </div>
    </div>
  </section>

  <section class="exhibitions-results">
    <div class="shell">
      <div class="active-filters" data-active-filters hidden></div>
      <div class="exhibition-grid" data-exhibition-grid></div>
      <div class="infinite-status" data-infinite-status>
        <span class="loading-dot"></span>
        <span>More exhibitions</span>
      </div>
      <div class="infinite-sentinel" data-infinite-sentinel aria-hidden="true"></div>
    </div>
  </section>
</main>

<button class="search-fab" type="button" data-filter-open aria-haspopup="dialog" aria-controls="filterSheet">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="11" cy="11" r="6"></circle>
    <path d="m16 16 4 4"></path>
  </svg>
  <span>検索</span>
</button>

<div class="sheet-backdrop" data-filter-backdrop hidden></div>
<section class="filter-sheet" id="filterSheet" role="dialog" aria-modal="true" aria-labelledby="filterTitle" aria-hidden="true">
  <div class="filter-sheet-handle" aria-hidden="true"></div>
  <div class="filter-sheet-head">
    <div>
      <small>Search & filter</small>
      <h2 id="filterTitle">展覧会を絞り込む</h2>
    </div>
    <button class="filter-close" type="button" data-filter-close aria-label="閉じる">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </button>
  </div>

  <div class="filter-sheet-body">
    <label class="keyword-field">
      <span>フリーワード</span>
      <div class="keyword-input-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg>
        <input type="search" placeholder="展覧会名・アーティスト・美術館" data-filter-keyword>
      </div>
    </label>

    <fieldset class="filter-group">
      <legend>エリア</legend>
      <div class="filter-chips" data-filter-group="area">
        <button type="button" class="filter-chip" data-value="銀座・丸の内">銀座・丸の内</button>
        <button type="button" class="filter-chip" data-value="六本木・青山">六本木・青山</button>
        <button type="button" class="filter-chip" data-value="上野・谷中">上野・谷中</button>
        <button type="button" class="filter-chip" data-value="清澄白河・湾岸">清澄白河・湾岸</button>
      </div>
    </fieldset>

    <fieldset class="filter-group">
      <legend>開催状況</legend>
      <div class="filter-chips" data-filter-group="status">
        <button type="button" class="filter-chip" data-value="now">開催中</button>
        <button type="button" class="filter-chip" data-value="upcoming">開催前</button>
      </div>
    </fieldset>

    <fieldset class="filter-group">
      <legend>会期</legend>
      <div class="filter-chips" data-filter-group="period">
        <button type="button" class="filter-chip" data-value="today">今日</button>
        <button type="button" class="filter-chip" data-value="weekend">今週末</button>
        <button type="button" class="filter-chip" data-value="month">今月</button>
        <button type="button" class="filter-chip" data-value="next">来月以降</button>
      </div>
    </fieldset>

    <fieldset class="filter-group">
      <legend>展示カテゴリ</legend>
      <div class="filter-chips" data-filter-group="category">
        <button type="button" class="filter-chip" data-value="企画展">企画展</button>
        <button type="button" class="filter-chip" data-value="個展">個展</button>
        <button type="button" class="filter-chip" data-value="現代美術">現代美術</button>
        <button type="button" class="filter-chip" data-value="デザイン">デザイン</button>
      </div>
    </fieldset>
  </div>

  <div class="filter-sheet-actions">
    <button class="filter-reset" type="button" data-filter-reset>リセット</button>
    <button class="filter-apply" type="button" data-filter-apply>この条件で見る</button>
  </div>
</section>

  <footer class="footer">
    <div class="shell footer-inner">
      <nav aria-label="Primary navigation" class="footer-nav">
        <a class="nav-item" href="./index.html">
          <svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9H7v-6h10v6"></path></svg>
          <span>ホーム</span>
        </a>
        <a class="nav-item active" href="./exhibitions.html">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"></rect><circle cx="9" cy="9" r="1.5"></circle><path d="m6.5 17 4-4 3 3 2-2 2 3"></path></svg>
          <span>展示会</span>
        </a>
        <a class="nav-item" href="./artists.html">
          <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"></rect><circle cx="12" cy="9" r="2.4"></circle><path d="M8.5 17c.5-2.3 1.8-3.5 3.5-3.5s3 1.2 3.5 3.5"></path></svg>
          <span>アーティスト</span>
        </a>
        <a class="nav-item" href="./museums.html">
          <svg viewBox="0 0 24 24"><path d="M3 9h18M5 9v10M9 9v10M15 9v10M19 9v10M3 19h18M4 8l8-5 8 5"></path></svg>
          <span>美術館</span>
        </a>
        <a class="nav-item" href="./map.html">
          <svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"></path><path d="M9 3v15M15 6v15"></path></svg>
          <span>マップ</span>
        </a>
        <a class="nav-item" href="./saved.html">
          <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"></path></svg>
          <span>保存</span>
        </a>
      </nav>
    </div>
  </footer>
<script src="./assets/js/muuzee-global.js?v=20260901-03"></script>
<script src="./assets/js/exhibition-data.js?v=20260828-08"></script>
<script src="./assets/js/exhibitions.js?v=20260828-08"></script>
<script src="./assets/js/muuzee-save-control.js?v=20260828-23"></script>
  <script defer src="./assets/js/muuzee-profile-ui.js?v=20260908-01"></script>
</body>
</html>
